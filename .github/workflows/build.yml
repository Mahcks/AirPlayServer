name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: airplayserver-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    env:
      RUNTIME_DIR: AirPlayServer/bin/x64
      RUNTIME_ZIP: airplay-runtime-win-x64.zip
      RUNTIME_SHA256: airplay-runtime-win-x64.sha256

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Create MSYS2 linker directory
        run: New-Item -ItemType Directory -Force -Path "C:\msys64\mingw32\lib\gcc\i686-w64-mingw32\9.2.0" | Out-Null
        shell: pwsh

      - name: Build solution (Release|x64)
        run: msbuild AirPlay.sln /p:Configuration=Release /p:Platform=x64 /m

      - name: Verify runtime layout
        run: |
          if (-not (Test-Path "$env:RUNTIME_DIR\MirrorSimAdapter.exe")) {
            throw "Expected runtime output '$env:RUNTIME_DIR\MirrorSimAdapter.exe' was not produced."
          }

      - name: Create runtime zip
        run: |
          if (Test-Path $env:RUNTIME_ZIP) {
            Remove-Item $env:RUNTIME_ZIP -Force
          }

          7z a -tzip $env:RUNTIME_ZIP ".\$env:RUNTIME_DIR\*"
        shell: pwsh

      - name: Create checksum file
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 $env:RUNTIME_ZIP).Hash.ToLowerInvariant()
          Set-Content -Path $env:RUNTIME_SHA256 -Value "$hash  $env:RUNTIME_ZIP" -NoNewline
        shell: pwsh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: airplay-runtime-win-x64
          path: |
            airplay-runtime-win-x64.zip
            airplay-runtime-win-x64.sha256

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            airplay-runtime-win-x64.zip
            airplay-runtime-win-x64.sha256
          generate_release_notes: true
