name: Build & Release

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: airplayserver-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    runs-on: windows-latest
    env:
      RUNTIME_DIR: AirPlayServer/bin/x64
      RUNTIME_ZIP: airplay-runtime-win-x64.zip
      RUNTIME_SHA256: airplay-runtime-win-x64.sha256
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Create MSYS2 linker directory
        run: New-Item -ItemType Directory -Force -Path "C:\msys64\mingw32\lib\gcc\i686-w64-mingw32\9.2.0" | Out-Null
        shell: pwsh

      - name: Build solution (Release|x64)
        run: msbuild AirPlay.sln /p:Configuration=Release /p:Platform=x64 /m

      - name: Verify adapter protocol and shutdown
        shell: pwsh
        run: |
          $featureHeader = Get-Content -Raw -LiteralPath 'AirPlayServerLib/lib/global.h'
          if ($featureHeader -notmatch '#define\s+GLOBAL_FEATURES\s+0x5A7FFEE6') {
            throw 'AirPlay capability advertisement must remain mirroring/audio-only.'
          }

          $adapter = Join-Path $env:RUNTIME_DIR 'MirrorSimAdapter.exe'
          if (-not (Test-Path -LiteralPath $adapter)) {
            throw "Expected runtime output '$adapter' was not produced."
          }

          Push-Location $env:RUNTIME_DIR
          try {
            $output = '{"name":"shutdown"}' | & '.\MirrorSimAdapter.exe'
            if ($LASTEXITCODE -ne 0) {
              throw "MirrorSimAdapter smoke test exited with code $LASTEXITCODE."
            }
            $events = @($output | ForEach-Object { $_ | ConvertFrom-Json })
            $ready = $events | Where-Object { $_.name -eq 'receiver_ready' } | Select-Object -First 1
            if ($null -eq $ready) {
              throw 'MirrorSimAdapter did not emit receiver_ready.'
            }
            if ($ready.protocol_version -ne '0.6.0') {
              throw "Expected adapter protocol 0.6.0, received '$($ready.protocol_version)'."
            }
            if ($ready.capabilities -notcontains 'pcm-audio') {
              throw 'MirrorSimAdapter did not advertise the required pcm-audio capability.'
            }
          }
          finally {
            Pop-Location
          }

      - name: Create runtime archive and checksum
        shell: pwsh
        run: |
          $runtimeFileNames = @(
            'airplay2dll.dll',
            'avcodec-58.dll',
            'avutil-56.dll',
            'MirrorSimAdapter.exe',
            'msys-2.0.dll',
            'swscale-5.dll'
          )
          foreach ($runtimeFileName in $runtimeFileNames) {
            $runtimeFile = Join-Path $env:RUNTIME_DIR $runtimeFileName
            if (-not (Test-Path -LiteralPath $runtimeFile -PathType Leaf)) {
              throw "Required runtime file was not produced: $runtimeFile"
            }
          }

          $archivePath = Join-Path $env:GITHUB_WORKSPACE $env:RUNTIME_ZIP
          Push-Location $env:RUNTIME_DIR
          try {
            & 7z a -tzip $archivePath @runtimeFileNames
            if ($LASTEXITCODE -ne 0) {
              throw "7z exited with code $LASTEXITCODE."
            }
          }
          finally {
            Pop-Location
          }
          $hash = (Get-FileHash -Algorithm SHA256 $archivePath).Hash.ToLowerInvariant()
          Set-Content -Path $env:RUNTIME_SHA256 -Value "$hash  $env:RUNTIME_ZIP" -NoNewline

      - name: Upload runtime artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: airplay-runtime-win-x64
          if-no-files-found: error
          retention-days: 7
          path: |
            airplay-runtime-win-x64.zip
            airplay-runtime-win-x64.sha256

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download runtime artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: airplay-runtime-win-x64
          path: release-assets

      - name: Attest runtime provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/airplay-runtime-win-x64.zip
            release-assets/airplay-runtime-win-x64.sha256
